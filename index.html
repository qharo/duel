<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vintage Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'neon-pink': '#ff2d78',
                        'neon-cyan': '#00d4ff',
                        'neon-yellow': '#f1c40f',
                    },
                    fontFamily: {
                        'pixel': ['"Press Start 2P"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 3px);
            pointer-events: none; z-index: 100;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(241,196,15,0.3); }
            50% { box-shadow: 0 0 25px rgba(241,196,15,0.7); }
        }
        .animate-pulse-glow { animation: pulse-glow 1.5s infinite; }
        .turn-display { font-size: 7px; color: #666; letter-spacing: 1px; }
        .turn-display.active { color: #f1c40f; }
        .status { font-size: 7px; padding: 12px; margin: 4px 0; letter-spacing: 1px; line-height: 1.6; text-align: center; }
        .status-waiting { color: #666; border: 2px solid #1a1a2e; }
        .status-connecting { color: #f1c40f; border: 2px solid rgba(241,196,15,0.3); }
        .status-connected { color: #4caf50; border: 2px solid rgba(76,175,80,0.3); }
        .status-error { color: #ff2d78; border: 2px solid rgba(255,45,120,0.3); }
        .text-win { color: #4caf50; text-shadow: 0 0 20px rgba(76,175,80,0.5); }
        .text-lose { color: #ff2d78; text-shadow: 0 0 20px rgba(255,45,120,0.5); }
        .text-draw { color: #f1c40f; text-shadow: 0 0 20px rgba(241,196,15,0.5); }
        .text-disconnected { color: #ff2d78; text-shadow: 0 0 15px rgba(255,45,120,0.5); }
        .copied { border-color: #4caf50 !important; color: #4caf50 !important; }
        canvas { cursor: pointer; }
        .btn-neon { font-family: 'Press Start 2P', monospace; transition: all 0.15s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-neon:active { transform: scale(0.97); }
        .btn-small { font-family: 'Press Start 2P', monospace; font-size: 6px; padding: 6px 10px; background: transparent; border: 2px solid #666; color: #666; cursor: pointer; transition: all 0.15s; text-transform: uppercase; }
        .btn-small:hover { border-color: #ff2d78; color: #ff2d78; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; }
    </style>
</head>
<body class="bg-[#0a0a0a] text-[#e0e0e0] h-screen overflow-hidden flex flex-col" style="font-family:'Press Start 2P',monospace;">

    <!-- ═══ HEADER ═══ -->
    <div class="flex-shrink-0 flex items-center gap-3 px-6 py-3 bg-[#111116] border-b-2 border-[#1a1a2e] z-10 min-h-[48px]">
        <button id="headerBack" class="hidden font-pixel text-[7px] bg-transparent border border-[#666] text-[#666] cursor-pointer px-2.5 py-1.5 transition-colors hover:border-[#ff2d78] hover:text-[#ff2d78]" onclick="handleBack()">← BACK</button>
        <h1 class="text-[13px] text-[#ff2d78] tracking-wider" style="text-shadow:0 0 15px rgba(255,45,120,0.5);">VINTAGE ARCADE</h1>
        <span class="text-[7px] text-[#666] tracking-wider max-sm:hidden">CHALLENGE A FRIEND P2P</span>
    </div>

    <!-- ═══ LANDING VIEW ═══ -->
    <div id="landing-view" class="view active flex-1 flex flex-col items-center overflow-y-auto px-6 py-6">
        <div id="gameGrid" class="w-full max-w-[700px] grid grid-cols-2 gap-4 max-[600px]:grid-cols-1 max-[600px]:max-w-[400px]"></div>
    </div>

    <!-- ═══ LOBBY VIEW ═══ -->
    <div id="lobby-view" class="view hidden flex-1 flex overflow-hidden">
        <div class="flex flex-1 md:flex-row flex-col">
            <div class="md:flex-[0_0_65%] flex-[0_0_120px] overflow-hidden bg-[#080810]"><canvas id="lobbyArt" class="w-full h-full block"></canvas></div>
            <div class="md:flex-[0_0_35%] flex-1 bg-[#111116] md:border-l-2 md:border-t-0 border-t-2 border-[#1a1a2e] flex flex-col items-center justify-center p-8 max-md:p-5 overflow-y-auto">
                <div class="w-full max-w-[360px] text-center flex flex-col items-center">
                    <div id="lobbyTitle" class="text-[15px] text-[#00d4ff] mb-1" style="text-shadow:0 0 15px rgba(0,212,255,0.4);">TIC-TAC-TOE</div>
                    <div class="text-[8px] text-[#666] mb-5 tracking-wider">Choose your role</div>
                    <button class="btn-neon w-full text-[10px] py-3.5 px-5 border-[3px] border-[#ff2d78] bg-transparent text-[#ff2d78] cursor-pointer mb-2.5 hover:bg-[#ff2d78] hover:text-[#0a0a0a] hover:shadow-[0_0_20px_rgba(255,45,120,0.5)]" onclick="createRoom()">CREATE ROOM</button>
                    <button class="btn-neon w-full text-[10px] py-3.5 px-5 border-[3px] border-[#666] bg-transparent text-[#666] cursor-pointer mb-2.5 hover:bg-[#666] hover:text-[#0a0a0a]" onclick="showJoinView()">JOIN ROOM</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══ HOST VIEW ═══ -->
    <div id="host-view" class="view hidden flex-1 flex overflow-hidden">
        <div class="flex flex-1 md:flex-row flex-col">
            <div class="md:flex-[0_0_65%] flex-[0_0_120px] overflow-hidden bg-[#080810]"><canvas id="hostArt" class="w-full h-full block"></canvas></div>
            <div class="md:flex-[0_0_35%] flex-1 bg-[#111116] md:border-l-2 md:border-t-0 border-t-2 border-[#1a1a2e] flex flex-col items-center justify-center p-8 max-md:p-5 overflow-y-auto">
                <div class="w-full max-w-[360px] text-center flex flex-col items-center">
                    <div class="text-[15px] text-[#00d4ff] mb-1" style="text-shadow:0 0 15px rgba(0,212,255,0.4);">YOUR ROOM</div>
                    <div class="w-full bg-[#0a0a0a] border-[3px] border-[#1a1a2e] p-5 my-3">
                        <div class="text-[7px] text-[#666] mb-3 tracking-wider">ROOM CODE</div>
                        <div id="codeDisplay" class="text-[30px] text-[#f1c40f] tracking-[8px] py-3 select-all break-all" style="text-shadow:0 0 20px rgba(241,196,15,0.4);"></div>
                        <button id="copyBtn" class="font-pixel text-[7px] px-4 py-2 bg-transparent border-2 border-[#666] text-[#666] cursor-pointer transition-colors hover:border-[#f1c40f] hover:text-[#f1c40f]" onclick="copyCode()">COPY</button>
                    </div>
                    <div id="hostStatus" class="status status-waiting">WAITING FOR OPPONENT...</div>
                    <button id="startBtn" class="hidden btn-neon w-full text-[12px] py-4 px-5 border-[3px] border-[#f1c40f] bg-transparent text-[#f1c40f] cursor-pointer mt-3 animate-pulse-glow hover:bg-[#f1c40f] hover:text-[#0a0a0a]" onclick="startGame()">START GAME</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══ JOIN VIEW ═══ -->
    <div id="join-view" class="view hidden flex-1 flex overflow-hidden">
        <div class="flex flex-1 md:flex-row flex-col">
            <div class="md:flex-[0_0_65%] flex-[0_0_120px] overflow-hidden bg-[#080810]"><canvas id="joinArt" class="w-full h-full block"></canvas></div>
            <div class="md:flex-[0_0_35%] flex-1 bg-[#111116] md:border-l-2 md:border-t-0 border-t-2 border-[#1a1a2e] flex flex-col items-center justify-center p-8 max-md:p-5 overflow-y-auto">
                <div class="w-full max-w-[360px] text-center flex flex-col items-center">
                    <div class="text-[15px] text-[#00d4ff] mb-1" style="text-shadow:0 0 15px rgba(0,212,255,0.4);">JOIN ROOM</div>
                    <input id="codeInput" type="text" maxlength="6" placeholder="CODE" autocomplete="off" class="font-pixel w-full px-4 py-3.5 bg-[#0a0a0a] border-[3px] border-[#1a1a2e] text-[#e0e0e0] text-[16px] text-center tracking-[8px] uppercase outline-none mb-3 transition-colors focus:border-[#00d4ff] placeholder:text-[#333] placeholder:text-[8px] placeholder:tracking-[2px] placeholder:normal-case" onkeypress="if(event.key==='Enter')joinRoom()">
                    <button class="btn-neon w-full text-[10px] py-3.5 px-5 border-[3px] border-[#ff2d78] bg-transparent text-[#ff2d78] cursor-pointer mb-2.5 hover:bg-[#ff2d78] hover:text-[#0a0a0a] hover:shadow-[0_0_20px_rgba(255,45,120,0.5)]" onclick="joinRoom()">CONNECT</button>
                    <div id="joinStatus" class="hidden"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══ GAME VIEW ═══ -->
    <div id="game-view" class="view hidden flex-1 flex-col items-center justify-center p-2 relative">
        <div class="w-full max-w-[520px] max-h-full flex flex-col items-center gap-2 relative">
            <div class="w-full flex justify-between items-center py-1">
                <div class="flex items-center gap-2.5">
                    <span id="gameBadge" class="text-[7px] text-[#00d4ff] px-2 py-1 border border-[#00d4ff] tracking-wider">GAME</span>
                    <span id="turnDisplay" class="turn-display">YOUR TURN</span>
                </div>
                <button class="btn-small" onclick="leaveGame()">LEAVE</button>
            </div>
            <div class="w-full flex-1 flex items-center justify-center min-h-0">
                <canvas id="gameCanvas" class="block max-w-full max-h-full border-[3px] border-[#1a1a2e] bg-[#0a0a0a] max-sm:border-2"></canvas>
            </div>

            <!-- Game Over Overlay -->
            <div id="gameoverOverlay" class="hidden absolute inset-0 bg-[rgba(0,0,0,0.88)] flex flex-col items-center justify-center gap-4 p-6 z-50">
                <div id="gameoverTitle" class="text-[16px] text-center leading-relaxed max-sm:text-[13px]"></div>
                <div id="gameoverSub" class="text-[7px] text-[#666] text-center leading-relaxed"></div>
                <button class="btn-neon w-full max-w-[260px] text-[10px] py-3.5 px-5 border-[3px] border-[#ff2d78] bg-transparent text-[#ff2d78] cursor-pointer hover:bg-[#ff2d78] hover:text-[#0a0a0a]" onclick="playAgain()">PLAY AGAIN</button>
                <button class="btn-neon w-full max-w-[260px] text-[10px] py-3.5 px-5 border-[3px] border-[#666] bg-transparent text-[#666] cursor-pointer hover:bg-[#666] hover:text-[#0a0a0a]" onclick="leaveGame()">LEAVE</button>
            </div>

            <!-- Disconnect Overlay -->
            <div id="disconnectOverlay" class="hidden absolute inset-0 bg-[rgba(0,0,0,0.88)] flex flex-col items-center justify-center gap-4 p-6 z-50">
                <div class="text-disconnected text-[16px] text-center leading-relaxed max-sm:text-[13px]">CONNECTION LOST</div>
                <div class="text-[7px] text-[#666] text-center leading-relaxed">Opponent disconnected</div>
                <button class="btn-neon w-full max-w-[260px] text-[10px] py-3.5 px-5 border-[3px] border-[#666] bg-transparent text-[#666] cursor-pointer hover:bg-[#666] hover:text-[#0a0a0a]" onclick="leaveGame()">BACK</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
